name: Create GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Create release archive
        run: |
          zip -r "trip-planner-build-${GITHUB_REF_NAME}.zip" build/

      - name: Generate release notes from commits
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          echo "## Changes" > release-notes.md
          echo "" >> release-notes.md

          if [ -n "${PREVIOUS_TAG}" ]; then
            git log "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" \
              --pretty=format:"- %s" >> release-notes.md
          else
            git log "${GITHUB_REF_NAME}" \
              --pretty=format:"- %s" >> release-notes.md
          fi

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "trip-planner-build-${GITHUB_REF_NAME}.zip" \
            --title "Trip Planner ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}